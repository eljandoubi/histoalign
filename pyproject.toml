[project]
name = "histoalign"
version = "0.1.0"
description = "Align H&E patches with spatial gene expression: frozen encoders, small projection heads"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "anndata>=0.10",
    "h5py>=3.10",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "scanpy>=1.10",
    "tifffile>=2024.2",
    "torch>=2.3",
    "transformers>=4.44",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/histoalign"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
